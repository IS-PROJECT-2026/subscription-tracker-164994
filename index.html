<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="SubTrack - Track and manage your recurring subscriptions."
    >

    <title>SubTrack</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <header class="topbar">
            <div class="brand">
                <h1>SubTrack</h1>
                <p>Subscription management made simple.</p>
            </div>
        </header>

        <div class="app-layout">

            <aside class="sidebar">
                <nav aria-label="Main navigation">
                    <a href="#" class="nav-link active">
                        Dashboard
                    </a>

                    <a href="#" class="nav-link">
                        Subscriptions
                    </a>

                    <a href="#" class="nav-link">
                        Analytics
                    </a>
                </nav>
            </aside>

            <main class="main-content">

                <section class="page-header">
                    <h2>Dashboard</h2>
                    <p>Keep track of your recurring subscriptions.</p>
                </section>

                <section class="dashboard-content">

                    <div class="section-heading">
                        <h3>Your Subscriptions</h3>
                    </div>

                    <div class="subscription-placeholder">
                        <p>
                            Your subscriptions will appear here.
                        </p>
                    </div>

                </section>

            </main>

        </div>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
